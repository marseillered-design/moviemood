<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- gold film, like the buttons of the site -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d08a"/>
      <stop offset=".55" stop-color="#d4a85a"/>
      <stop offset="1" stop-color="#a8742f"/>
    </linearGradient>
    <!-- a soft light in the top-left corner -->
    <radialGradient id="shine" cx=".2" cy=".12" r=".6">
      <stop offset="0" stop-color="#fff6dc" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff6dc" stop-opacity="0"/>
    </radialGradient>
    <!-- film frame with see-through sprocket holes -->
    <mask id="film">
      <rect width="64" height="64" rx="14" fill="#fff"/>
      <g fill="#000">
        <rect x="4" y="9" width="5" height="8" rx="1.3"/>
        <rect x="4" y="28" width="5" height="8" rx="1.3"/>
        <rect x="4" y="47" width="5" height="8" rx="1.3"/>
        <rect x="55" y="9" width="5" height="8" rx="1.3"/>
        <rect x="55" y="28" width="5" height="8" rx="1.3"/>
        <rect x="55" y="47" width="5" height="8" rx="1.3"/>
      </g>
    </mask>
  </defs>
  <g mask="url(#film)">
    <rect width="64" height="64" fill="url(#gold)"/>
    <rect width="64" height="64" fill="url(#shine)"/>
  </g>
  <!-- "M" from Bebas Neue, in the dark chocolate of the site -->
  <path transform="translate(32 32) scale(.98) translate(-32 -32)" d="M18.97 52V12h8.97l4 28.63h.12l4-28.63h8.97v40h-5.94V21.71h-.12L34.4 52h-5.26l-4.57-30.29h-.11V52z" fill="#120c09"/>
</svg>
