<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorites - MovieMood</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.themoviedb.org">
  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="stylesheet" href="style.css?v=20261016f">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <!-- Vercel Web Analytics -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
  <meta name="theme-color" content="#0d0d14">
</head>
<body class="home-body" data-page="favorites">
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="noise-overlay"></div>

  <nav class="home-nav">
    <a href="/" class="nav-logo">MOVIEMOOD</a>
    <div>
      <a href="feed.html" class="nav-favorites">&#x1F3AC; Feed</a>
      <a href="seen.html" class="nav-favorites">&#x1F37F; Seen</a>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
        <span class="icon-sun">&#x2600;&#xFE0F;</span>
        <span class="icon-moon">&#x1F319;</span>
      </button>
    </div>
  </nav>

  <header class="page-header">
    <h1 class="page-title">My Favorites</h1>
    <p class="fav-count" id="favCount"></p>
  </header>

  <main class="home-main">
    <div class="fav-empty" id="emptyState" style="display: none;">
      <div class="fav-empty-icon">&#x1F3AC;</div>
      <h2>No favorites yet</h2>
      <p>Explore movies and hit &#x2764;&#xFE0F; to save them here</p>
      <a href="/" class="btn-discover">Discover Movies</a>
    </div>

    <div class="fav-grid" id="favoritesGrid"></div>

    <div class="fav-actions" id="favActions" style="display: none;">
      <button class="btn-clear-all" id="clearAllBtn">&#x1F5D1;&#xFE0F; Clear all favorites</button>
    </div>
  </main>

  <footer class="home-footer">
    <p>Powered by TMDB API</p>
  </footer>

  <script>
    const themeToggle = document.getElementById('theme-toggle');
    const root = document.documentElement;

    let savedTheme = null;
    try { savedTheme = localStorage.getItem('theme'); } catch (e) {}
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (savedTheme === 'light') {
      root.setAttribute('data-theme', 'light');
    } else if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
      root.setAttribute('data-theme', 'dark');
    }

    themeToggle?.addEventListener('click', () => {
      const currentTheme = root.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', newTheme);
      try { localStorage.setItem('theme', newTheme); } catch (e) {}
    });
  </script>

  <script src="i18n.js?v=20261016f"></script>

  <script src="/urls.js?v=20261016f"></script>
  <script src="nav.js?v=20261016f"></script>

  <script src="favorites.js?v=20261016f"></script>
</body>
</html>
