<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Trailer Feed - MovieMood</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.themoviedb.org">
  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="stylesheet" href="style.css?v=20261019e">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="/icon-192.png?v=2" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <link rel="manifest" href="/site.webmanifest">
  <!-- Vercel Web Analytics -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="reels-body" data-page="feed">
  <header class="reels-top">
    <a href="/" class="nav-logo reels-logo">MOVIEMOOD</a>
    <a href="/" class="reels-close" id="reelsClose" aria-label="Close">&#x2715;</a>
  </header>

  <!-- One full-screen trailer per swipe; feed.js fills this -->
  <main class="reels-feed" id="reelsFeed"></main>

  <p class="reels-status" id="reelsStatus">Loading trailers...</p>
  <div class="reels-toast" id="reelsToast" hidden></div>

  <div class="reels-arrows">
    <button class="reels-arrow" id="reelPrev" type="button">&#x25B2;</button>
    <button class="reels-arrow" id="reelNext" type="button">&#x25BC;</button>
  </div>

  <script src="i18n.js?v=20261019e"></script>

  <script src="/urls.js?v=20261019e"></script>
  <script src="feed.js?v=20261019e"></script>
</body>
</html>
