<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Trailer Feed - MovieMood</title>
  <link rel="stylesheet" href="style.css?v=20261014e">
</head>
<body class="reels-body" data-page="feed">
  <header class="reels-top">
    <a href="index.html" class="nav-logo reels-logo">MOVIEMOOD</a>
    <a href="index.html" class="reels-close" id="reelsClose" aria-label="Close">&#x2715;</a>
  </header>

  <!-- One full-screen trailer per swipe; feed.js fills this -->
  <main class="reels-feed" id="reelsFeed"></main>

  <p class="reels-status" id="reelsStatus">Loading trailers...</p>
  <div class="reels-toast" id="reelsToast" hidden></div>

  <div class="reels-arrows">
    <button class="reels-arrow" id="reelPrev" type="button">&#x25B2;</button>
    <button class="reels-arrow" id="reelNext" type="button">&#x25BC;</button>
  </div>

  <script src="i18n.js?v=20261014e"></script>
  <script src="feed.js?v=20261014e"></script>
</body>
</html>
