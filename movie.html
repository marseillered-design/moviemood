<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieMood</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.themoviedb.org">
  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="stylesheet" href="style.css?v=20261019d">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="/icon-192.png?v=2" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <link rel="manifest" href="/site.webmanifest">
  <!-- Vercel Web Analytics -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
  <meta name="theme-color" content="#120c09">
</head>
<body class="movie-body" data-page="movie">
  <nav class="movie-nav">
    <a href="/" class="nav-logo">MovieMood</a>
    <div class="nav-links">
      <a href="feed.html" class="nav-link">&#x1F3AC; Feed</a>
      <a href="favorites.html" class="nav-link">&#x2764;&#xFE0F; Favorites</a>
      <a href="seen.html" class="nav-link">&#x1F37F; Seen</a>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
        <span class="icon-sun">&#x2600;&#xFE0F;</span>
        <span class="icon-moon">&#x1F319;</span>
      </button>
    </div>
  </nav>

  <section class="movie-hero-section">
    <div class="hero-backdrop" id="heroBackdrop"></div>
    <div class="hero-video-wrapper" id="heroVideoWrapper"></div>
    <div class="hero-gradient"></div>
    <div class="hero-content">
      <div class="hero-left">
        <div class="hero-badges" id="heroBadges"></div>
        <h1 class="hero-title" id="movieTitle"></h1>
        <div class="hero-meta" id="heroMeta"></div>
        <div class="hero-moods" id="heroMoods" hidden></div>
        <p class="hero-overview" id="movieOverview"></p>
        <div class="hero-actions">
          <button class="btn-play" id="btnPlayTrailer">&#x25B6; Play Trailer</button>
          <button class="btn-fav" id="btnFavorite">&#x1F90D; Add to Favorites</button>
          <button class="btn-fav" id="btnWatched" type="button"></button>
          <a href="#" class="btn-imdb" id="imdbLink" target="_blank" rel="noopener" style="display: none;">&#x1F3AC; IMDb</a>
        </div>
        <div class="hero-providers" id="watchProviders"></div>
      </div>
    </div>
    <button class="mute-btn" id="muteBtn" style="display: none;">&#x1F507;</button>
  </section>

  <section class="movie-details-section">
    <div class="details-grid">
      <div class="details-poster">
        <img id="moviePoster" src="" alt="Movie Poster">
      </div>
      <div class="details-info">
        <div class="info-row" data-row="director">
          <span class="info-label">Director</span>
          <div id="movieDirector"></div>
        </div>

        <div class="info-row" data-row="cast">
          <span class="info-label">Cast</span>
          <div class="cast-scroll" id="movieCast"></div>
        </div>

        <div class="info-row" data-row="genres">
          <span class="info-label">Genres</span>
          <div class="genre-tags" id="movieGenres"></div>
        </div>

        <div class="info-row" data-row="rating">
          <span class="info-label">Rating</span>
          <div class="ratings-row">
            <span class="rating-badge tmdb-badge">&#x2B50; <span id="tmdbRating"></span> TMDB</span>
          </div>
        </div>
      </div>
    </div>

    <section class="similar-section" id="similarSection" style="display: none;">
      <h2 class="section-title">More Like This</h2>
      <div class="similar-grid" id="similarGrid"></div>
    </section>
  </section>

  <div class="trailer-modal" id="trailerModal">
    <div class="trailer-modal-inner">
      <button class="modal-close" id="modalClose">&#x2715;</button>
      <div id="trailerContainer"></div>
    </div>
  </div>

  <script>
    const themeToggle = document.getElementById('theme-toggle');
    const root = document.documentElement;

    let savedTheme = null;
    try { savedTheme = localStorage.getItem('theme'); } catch (e) {}
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (savedTheme === 'light') {
      root.setAttribute('data-theme', 'light');
    } else if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
      root.setAttribute('data-theme', 'dark');
    }

    themeToggle?.addEventListener('click', () => {
      const currentTheme = root.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', newTheme);
      try { localStorage.setItem('theme', newTheme); } catch (e) {}
    });
  </script>

  <script src="i18n.js?v=20261019d"></script>

  <script src="/urls.js?v=20261019d"></script>
  <script src="nav.js?v=20261019d"></script>

  <script src="movie.js?v=20261019d"></script>
</body>
</html>
