<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieMood</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.themoviedb.org">
  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="stylesheet" href="style.css?v=20261028b">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,700&family=Inter:wght@300;400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,700&family=Inter:wght@300;400;500;600&display=swap"></noscript>
  <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="/icon-192.png?v=2" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <link rel="manifest" href="/site.webmanifest">
  <!-- Cloudflare Web Analytics (Cloudflare → Analytics & Logs → Web Analytics) -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "7bdb18122f374e60984fb2931f067490"}'></script>
  <meta name="theme-color" content="#120c09">
</head>
<body class="home-body" data-page="person">
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="noise-overlay"></div>

  <nav class="home-nav">
    <a href="/" class="nav-logo" style="-webkit-text-fill-color:transparent">MovieMood</a>
    <div>
      <a href="feed.html" class="nav-favorites">&#x1F3AC; Feed</a>
      <a href="favorites.html" class="nav-favorites">&#x2764;&#xFE0F; Favorites</a>
      <a href="seen.html" class="nav-favorites">&#x1F37F; Seen</a>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
        <span class="icon-sun">&#x2600;&#xFE0F;</span>
        <span class="icon-moon">&#x1F319;</span>
      </button>
    </div>
  </nav>

  <div class="person-hero-section">
    <div class="person-hero-blur" id="personHeroBlur"></div>
    <div class="person-hero-gradient"></div>
    <div class="person-hero-content">
      <div class="person-photo-wrapper">
        <img id="personPhoto" src="" alt="" class="person-photo">
      </div>
      <div class="person-meta">
        <div class="person-badges" id="personBadges"></div>
        <h1 class="person-name" id="personName"></h1>
        <div class="person-details" id="personDetails"></div>
        <p class="person-bio" id="personBio"></p>
      </div>
    </div>
  </div>

  <main class="home-main">
    <section class="person-films-section">
      <h2 class="section-heading" id="personMoviesTitle"></h2>
      <div class="movies-grid" id="moviesGrid"></div>
    </section>
  </main>

  <footer class="home-footer">
    <p>Powered by TMDB API</p>
    <p class="footer-premiero"><span data-i18n="footer.premiero">What’s coming out this week? Movie, series &amp; game premieres —</span> <a href="https://thepremiero.com/en/us" data-premiero>Premiero</a></p>
  </footer>

  <script>
    const themeToggle = document.getElementById('theme-toggle');
    const root = document.documentElement;

    const savedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (savedTheme === 'light') {
      root.setAttribute('data-theme', 'light');
    } else if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
      root.setAttribute('data-theme', 'dark');
    }

    themeToggle?.addEventListener('click', () => {
      const currentTheme = root.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });
  </script>

  <script src="i18n.js?v=20261028b"></script>

  <script src="/urls.js?v=20261028b"></script>
  <script src="nav.js?v=20261028b"></script>

  <script src="person.js?v=20261028b"></script>
</body>
</html>
